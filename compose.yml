x-default-policy: &default_policy
  restart: unless-stopped
  logging:
    driver: loki
    options:
      loki-url: http://loki:3100/loki/api/v1/push

services:
  grafana:
    <<: *default_policy
    container_name: grafana
    image: grafana/grafana:13.2.0@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
    env_file:
      - .env
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - 3000:3000
  loki:
    <<: *default_policy
    container_name: loki
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    ports:
      - 127.0.0.1:3100:3100
    volumes:
      - loki-data:/loki
  prometheus:
    <<: *default_policy
    container_name: prometheus
    image: prom/prometheus:v2.54.0@sha256:497fe921f22fea8535fa2bcb1c193dacc6ce98c08274257b3d18a4eaae0f9647
    command: "--config.file=/etc/prometheus/prometheus.yaml --web.config.file=/etc/prometheus/web.yaml --storage.tsdb.retention.size=80GB"
    volumes:
      - prometheus-data:/etc/prometheus/data/
    healthcheck:
      interval: "30s"
      timeout: "1m30s"
      retries: 10
      start_period: "10s"
      test: ["CMD", "wget", "http://localhost:9090"]
  https-portal:
    <<: *default_policy
    container_name: https-portal
    image: steveltn/https-portal:1.25.7@sha256:fafefaf18b3e602e38f6d973d5145403bf6d07f21721b6c522fab377e51bc7f8
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - https-portal-data:/var/lib/https-portal
    environment:
      WEBSOCKET: "true"
    depends_on:
      - grafana
      - prometheus
      - loki

volumes:
  grafana-data:
    external: true
  loki-data:
    external: true
  prometheus-data:
    external: true
  https-portal-data:
